<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="The Singapore Government Design System was developed to empower teams in creating fast, accessible and mobile-friendly digital services.">
    <meta property="og:title"
        content="Singapore Government Design System: Build your next best digital experience for Singapore">
    <meta property="og:image" content="https://www.designsystem.tech.gov.sg/assets/img/logo-sgds.svg">
    <meta property="og:description"
        content="The Singapore Government Design System was developed to empower teams in creating fast, accessible and mobile-friendly digital services.">
    <meta property="og:url" content="https://www.designsystem.tech.gov.sg">
    <title>SGDS | {{page.title}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600;700&display=swap" rel="stylesheet">
    {% if jekyll.environment == "production" %}
    <!-- Google Tag Manager -->
    <script async src="/assets/js/google-tag-manager.bundle.js"></script>
    <!-- End Google Tag Manager -->
    {% endif %}
    <!-- this polyfill is required for web component cdn to prevent clash of custom element registration -->
    <script src="https://cdn.jsdelivr.net/npm/@webcomponents/scoped-custom-element-registry"></script>
    {% assign latestVersion = site.data.npm-sgds-web-component-latest-metadata.objects[0].package.version %}
    <link href='{{site.web-component-cdn}}@{{latestVersion}}/themes/day.css' rel='stylesheet' type='text/css' />
    <script defer type="module" src="{{site.web-component-cdn}}@{{latestVersion}}">
    </script>
    <script defer type="module"
        src="https://assets.developer.tech.gov.sg/bundled-scripts/dev-console-widget.bundle.js"></script>
    <link rel="stylesheet" href="/assets/custom-css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script defer type="module" src="/assets/js/portal-polyfills.bundle.js"></script>
    {% if jekyll.environment == "production" %}
    <script defer src="https://assets.wogaa.sg/scripts/wogaa.js"></script>
    {% else %}
    <script defer src="https://assets.dcube.cloud/scripts/wogaa.js"></script>
    {% endif %}
</head>
