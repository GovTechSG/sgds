name: Sync Storybook Stories

on:
  schedule:
    # Every day at 7:00 PM SGT (11:00 UTC)
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v3 branch
        uses: actions/checkout@v4
        with:
          ref: v3
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run storybook diff
        id: diff
        run: |
          node scripts/storybook-diff.mjs --output /tmp/storybook-diff.json
          cat /tmp/storybook-diff.json

      - name: Check for new stories
        id: check
        run: |
          HAS_CHANGES=$(node -e "
            const d = require('/tmp/storybook-diff.json');
            console.log(d.hasChanges ? 'true' : 'false');
          ")
          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"

      - name: Extract story summary
        if: steps.check.outputs.has_changes == 'true'
        id: stories
        run: |
          node <<'SCRIPT' >> "$GITHUB_OUTPUT"
            const d = require('/tmp/storybook-diff.json');
            const templates = d.newStories.filter(s => s.kind === 'template');
            const blocks = d.newStories.filter(s => s.kind === 'block');

            const keys = d.newStories.map(s => s.key);
            const suffix = keys.slice(0, 3).join('-') + (keys.length > 3 ? '-and-more' : '');
            console.log('branch_suffix=' + suffix);
            console.log('template_count=' + templates.length);
            console.log('block_count=' + blocks.length);
            console.log('total=' + d.newStories.length);
          SCRIPT

      - name: Check for existing PR or branch
        if: steps.check.outputs.has_changes == 'true'
        id: existing
        run: |
          SUFFIX="${{ steps.stories.outputs.branch_suffix }}"
          BRANCH="auto/sync-stories-${SUFFIX}"
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "PR already exists for $BRANCH"
          elif git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Remote branch $BRANCH already exists"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate storybook stubs
        if: steps.check.outputs.has_changes == 'true' && steps.existing.outputs.skip != 'true'
        run: |
          node scripts/generate-storybook-stubs.mjs /tmp/storybook-diff.json

      - name: Build PR description
        if: steps.check.outputs.has_changes == 'true' && steps.existing.outputs.skip != 'true'
        run: |
          node -e "
          const diff = require('/tmp/storybook-diff.json');
          const lines = [];

          lines.push('## Summary');
          lines.push('');
          lines.push('Syncs new Storybook stories (templates & blocks) into the portal.');
          lines.push('');

          const templates = diff.newStories.filter(s => s.kind === 'template');
          const blocks = diff.newStories.filter(s => s.kind === 'block');

          if (templates.length) {
            lines.push('### New Templates');
            lines.push('');
            for (const s of templates) {
              lines.push('- **' + s.key + '**: \`' + s.id + '\`');
            }
            lines.push('');
          }

          if (blocks.length) {
            lines.push('### New Blocks');
            lines.push('');
            for (const s of blocks) {
              lines.push('- **' + s.key + '**: \`' + s.id + '\`');
            }
            lines.push('');
          }

          lines.push('### Manual TODO');
          lines.push('');
          lines.push('- [ ] Verify Storybook embed URLs render correctly');
          lines.push('- [ ] Add to pattern-docs.ts category groups if applicable');
          lines.push('');
          lines.push('---');
          lines.push('_Auto-generated by sync-storybook-stories workflow_');

          require('fs').writeFileSync('/tmp/pr-body.md', lines.join('\n'));
          " 2>&1

      - name: Create branch and PR
        if: steps.check.outputs.has_changes == 'true' && steps.existing.outputs.skip != 'true'
        run: |
          SUFFIX="${{ steps.stories.outputs.branch_suffix }}"
          BRANCH="auto/sync-stories-${SUFFIX}"
          TOTAL="${{ steps.stories.outputs.total }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "docs(stories): sync ${TOTAL} new storybook stories

          Auto-generated story mappings and preview pages."

          git push --force-with-lease origin "$BRANCH"

          # Create label if it doesn't exist (ignore errors if it already exists)
          gh label create "auto-sync" --description "Auto-generated sync PRs" --color "0E8A16" 2>/dev/null || true

          gh pr create \
            --base v3 \
            --head "$BRANCH" \
            --title "docs(stories): sync ${TOTAL} new storybook stories" \
            --body-file /tmp/pr-body.md \
            --label "auto-sync"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
